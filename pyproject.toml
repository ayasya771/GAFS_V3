[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gafs"
version = "1.0.0"
description = "Generative Adversarial Financial Simulation: WGAN-GP with a conditional TFT generator and SimCLR contrastive regularisation for synthetic market scenarios"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayasya Batta" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "torch>=2.1",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
alpaca = ["alpaca-py>=0.21"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["gafs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
